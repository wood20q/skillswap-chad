<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Skill Swap</title>
</head>
<body>
    <header>
        <h1>Skill Swap</h1>
        <nav>
            <ul>
                <li><a href="" class="selected">Home</a></li>
                <li><a href="">All Skills</a></li>
                <li><a href="">Post Skill</a></li>
                <li><a href="">about</a></li>
            </ul>
        </nav>
        <div class="searchWrapper">
            <input type="text" name="search" id="search">
            <button type="submit" class="searchButton">Search</button>
        </div>
    </header>

    <main>
        <div class="titleBar">
            <h1>Share and Learn new skills with Skill Swap</h1>
        </div>

        <div class="featuredSkills">
            <h1>Featured Skills</h1>
            <div class="featuredSkillsWrapper">
                <div class="skillCard">
                    <h1>Skill 1</h1>
                    <h3 class="price">$30/hour</h3>
                    <p>This is Skill 1</p>
                    <button class="bookNow">Book Now</button>
                </div>

                <div class="skillCard">
                    <h1>Skill 2</h1>
                    <h3 class="price">$50/hour</h3>
                    <p>This is Skill 2</p>
                    <button class="bookNow">Book Now</button>
                </div>

                <div class="skillCard">
                    <h1>Skill 3</h1>
                    <h3 class="price">$25/hour</h3>
                    <p>This is Skill 3</p>
                    <button class="bookNow">Book Now</button>
                </div>
                
                <div class="skillCard">
                    <h1>Skill 4</h1>
                    <h3 class="price">$10/hour</h3>
                    <p>This is Skill 4</p>
                    <button class="bookNow">Book Now</button>
                </div>

            </div>
        </div>

    </main>

    <footer>
        <h2>Footer Text</h2>
        <a href="https://github.com/wood20q/skillswap-chad" target="_blank">gitHub link</a>
    </footer>
</body>
</html>
